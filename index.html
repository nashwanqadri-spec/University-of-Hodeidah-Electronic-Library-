<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الإلكترونية الشاملة - جامعة الحديدة</title>
    <!-- خطوط جوجل العربية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ملف الـ CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header class="navbar">
        <div class="logo-area">
            <div class="logo-badge"><i class="fa-solid fa-graduation-cap"></i></div>
            <div class="logo-text">
                <h1>جامعة الحديدة</h1>
                <span>المكتبة الإلكترونية الأكاديمية</span>
            </div>
        </div>
        <div class="search-box">
            <input type="text" id="globalSearch" placeholder="ابحث عن كلية، قسم، أو كتاب...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="nav-controls">
            <button id="themeToggle" title="تغيير المظهر"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>

    <!-- شريط المسار التفاعلي (Breadcrumb) -->
    <nav class="breadcrumb-bar" id="breadcrumbBar">
        <span class="active-path"><i class="fa-solid fa-house"></i> الرئيسية (الكليات)</span>
    </nav>

    <!-- المحتوى الديناميكي المتفاعل -->
    <main class="main-content" id="appContainer">
        <!-- يتم توليد المحتوى هنا برمجياً بواسطة الجافاسكريبت -->
    </main>

    <!-- تذييل الصفحة -->
    <footer class="footer">
        <p>جميع الحقوق محفوظة &copy; 2026 - جامعة الحديدة | تطوير البوابة الإلكترونية التفاعلية</p>
    </footer>

    <!-- ملف الجافاسكريبت -->
    <script src="script.js"></script>
</body>
</html>
